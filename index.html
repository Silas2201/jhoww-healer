<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08110e"><link rel="manifest" href="manifest.webmanifest"><title>Jhoww Healer Companion</title><style>body{margin:0;background:#08110e;color:#eef9f2;font-family:Arial,sans-serif}*{box-sizing:border-box}.app{max-width:680px;margin:auto;padding:18px 18px 90px}.brand{color:#65e6a2;font-weight:900;letter-spacing:2px;font-size:13px}.sub,.muted{color:#80968c}.hero,.card{background:#101b17;border:1px solid #203b30;border-radius:16px;padding:15px;margin:12px 0}.hero h1{margin:0;font-size:28px}.stats{display:flex;gap:10px}.stat{flex:1;background:#09130f;padding:10px;border-radius:10px}.stat input{width:100%;font-size:22px;background:transparent;color:#fff;border:0;font-weight:800}.tabs{display:flex;gap:6px;position:sticky;top:0;background:#08110eee;padding:10px 0;z-index:5}.tabs button,.pill{flex:1;background:#101b17;color:#eafff3;border:0;border-radius:11px;padding:11px}.tabs .on,.pill.on{background:#1f6b48}.page{display:none}.page.on{display:block}.hunt{background:#101b17;border:1px solid #203b30;border-radius:14px;padding:14px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:10px}.score{color:#66e590;font-size:20px;font-weight:900}.good{color:#63d996}.warn{color:#d6b66d}.equipHead{color:#61d894;font-size:11px;letter-spacing:1.5px;margin-top:18px}.item{display:flex;gap:11px;align-items:center;padding:12px;background:#0e1814;border:1px solid #1d3129;border-radius:12px;margin:6px 0}.item.have{background:#13271d;border-color:#3c9b6b}.check{font-size:22px;color:#64df9a;width:26px}.filters{display:flex;gap:6px}.filters button{background:transparent;color:#d7eee1;border:1px solid #315743;padding:7px 11px;border-radius:18px}.filters button.on{background:#245f42}small{color:#82958b}.install{width:100%;background:#65d997;color:#062217;border:0;border-radius:12px;padding:13px;font-weight:900;margin-top:10px;display:none}</style></head><body><main class="app"><div class="brand">JHOWW HEALER COMPANION</div><div class="sub">Elder Druid • Floribra</div><section class="hero"><h1>Jhoww Healer</h1><div class="stats"><label class="stat"><small>Level</small><input id="level" inputmode="numeric" value="240"></label><label class="stat"><small>Magic Level</small><input id="ml" inputmode="numeric" value="79"></label></div><button id="install" class="install">Instalar na tela inicial</button></section><nav class="tabs"><button data-tab="hunts" class="on">⚔ Hunts</button><button data-tab="equip">🎒 Equip.</button><button data-tab="profile">🧙 Perfil</button></nav><section id="hunts" class="page on"><h2>Hunts para você</h2><div class="filters"><button data-goal="xp">XP</button><button data-goal="profit">Profit</button><button data-goal="balance" class="on">Balanceado</button></div><div id="huntList"></div></section><section id="equip" class="page"><h2>Meus equipamentos</h2><div class="muted">Toque nos itens que você possui. A seleção fica salva neste celular.</div><div id="equipList"></div></section><section id="profile" class="page"><div class="card" id="profileCard"></div></section></main><script>
const hunts=[['Crumbling Caverns',200,'Ice','Fire','3.0kk','400k',1],['Werehyaenas South',200,'Ice','Death',null,null,0],['Werehyaenas North',200,'Ice','Death',null,null,0],['Glooth Bandits',200,'Fire','Physical',null,null,0],['Minotaur Cults',200,'Ice','Physical',null,null,0],['Pirats',200,'Earth','Physical',null,null,0],['Medusa Tower',250,'Energy','Earth',null,null,0],["Carnivora's Rock",250,'Fire / Ice','Earth',null,null,0]];
const eq={Rods:[['Rod of Destruction',200],['Cobra Rod',220],['Eldritch Rod',250],['Naga Rod',250],['Lion Rod',270],['Falcon Rod',300],['Soulhexer',400]],Helmets:[['Batwing Hat',0],['Gnome Helmet',200],['Falcon Circlet',300]],Armors:[['Magma Coat',40],['Firemind Raiment',200],['Bear Skin',230]],Legs:[['Magma Legs',40],['Gnome Legs',200]],Spellbooks:[['Wooden Spellbook',0],['Shoulder Plate',180],['Creamy Grimoire',200],['Lion Spellbook',220]],Boots:[['Boots of Haste',0],['Pair of Dreamwalkers',180]]};
const defaults=['Rod of Destruction','Batwing Hat','Magma Coat','Magma Legs','Wooden Spellbook','Boots of Haste'];let owned=new Set(JSON.parse(localStorage.getItem('owned')||JSON.stringify(defaults)));const level=document.querySelector('#level'),ml=document.querySelector('#ml');level.value=localStorage.level||240;ml.value=localStorage.ml||79;
function render(){let lv=+level.value||0;document.querySelector('#huntList').innerHTML=hunts.filter(h=>h[1]<=lv).map(h=>`<article class="hunt"><div class="row"><b>${h[0]}</b><span class="score">${Math.min(99,Math.round(75+(lv-h[1])*.08+(h[0]=='Crumbling Caverns'?18:0)))}%</span></div><small>Lv ${h[1]}+ • ataque: ${h[2]} • proteção: ${h[3]}</small>${h[4]?`<p class="good">Seu benchmark: ${h[4]} RAW/h • ${h[5]} profit/h</p>`:`<p class="warn">Benchmark 2026 ainda não confirmado</p>`}</article>`).join('');document.querySelector('#equipList').innerHTML=Object.entries(eq).map(([cat,items])=>`<h3 class="equipHead">${cat.toUpperCase()}</h3>${items.map(([n,l])=>`<div class="item ${owned.has(n)?'have':''}" data-item="${n}"><span class="check">${owned.has(n)?'✓':'○'}</span><div><b>${n}</b><br><small>Level ${l||'livre'}</small></div></div>`).join('')}`).join('');document.querySelectorAll('[data-item]').forEach(e=>e.onclick=()=>{owned.has(e.dataset.item)?owned.delete(e.dataset.item):owned.add(e.dataset.item);localStorage.owned=JSON.stringify([...owned]);render()});document.querySelector('#profileCard').innerHTML=`<h2>Perfil</h2><p>Personagem: <b>Jhoww Healer</b></p><p>Vocação: Elder Druid</p><p>Level: ${lv}</p><p>Magic Level: ${ml.value}</p><p>Itens marcados: ${owned.size}</p><p class="good">Crumbling: 3.0kk RAW/h • ~400k profit/h</p>`}
[level,ml].forEach(x=>x.oninput=()=>{localStorage.level=level.value;localStorage.ml=ml.value;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelector('#'+b.dataset.tab).classList.add('on')});let prompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();prompt=e;install.style.display='block'});install.onclick=async()=>{if(prompt){prompt.prompt();await prompt.userChoice;prompt=null;install.style.display='none'}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
